name: docker-buildx
on:
  pull_request:
    branches:
      - master
      - experimental
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    branches:
      - master
    tags:
      - '*.*'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
    steps:
    - uses: getong/mariadb-action@v1.11
      with:
        mysql database: 'pigallery_test'
        mysql root password: 'password'
        mysql user: 'user'
        mysql password: 'password'
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Use project npm version
      run: npm install --global npm@11.19.0

    - name: Verify MariaDB connection
      env:
        PORT: ${{ job.services.mariadb.ports[3306] || '3306' }}
      run: |
        while ! mysqladmin ping -h"127.0.0.1" -P"$PORT" --silent; do
          sleep 1
        done

    - name: npm install and build
      run: |
        npm ci
        npm run build

    - name: lint
      run: |
        npm run lint
    - name: test
      run: |
        npm test
        npm run coverage
      env:
        MYSQL_HOST: localhost
        MYSQL_USERNAME: root
        MYSQL_PASSWORD: password
        MYSQL_PORT: ${{ job.services.mariadb.ports[3306] || '3306' }}
        PORT: 35000
        CI: true
    - name: Coveralls
      uses: coverallsapp/github-action@v2
      with:
        fail-on-error: false
    - name: E2E test - Cypress run
      uses: cypress-io/github-action@v7
      env:
        DEBUG: '@cypress/github-action'
      with:
        start: npm run start-e2e-server
      # after the test run completes store screenshots
    - uses: actions/upload-artifact@v7
      if: failure() # Store screenshots only on failures
      with:
         name: cypress-screenshots
         path: test/cypress/screenshots
         if-no-files-found: ignore # 'warn' or 'error' are also available, defaults to `warn`

  create-release:
    runs-on: [ubuntu-latest]
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Setup Node.js for use with actions
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      -
        name: Use project npm version
        run: npm install --global npm@11.19.0
      -
        name: Install Deps
        run: npm ci
      -
        name: Create Release
        run: npm run create-release -- --skip-opt-packages=ffmpeg-static,ffprobe-static --force-opt-packages
      - uses: actions/upload-artifact@v7
        with:
          name: pigallery2-release
          path: release

  # --- NATIVE MULTI-PLATFORM DOCKER VERIFICATION ---
  build-verify-docker-image:
    name: build-verify-docker (${{ matrix.container }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [create-release]
    strategy:
      fail-fast: false # Ensures one platform failure doesn't stop others from testing
      matrix:
        include:
          - container: alpine
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - container: alpine
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - container: debian-trixie
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - container: debian-trixie
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Release Artifact
        uses: actions/download-artifact@v8
        with:
          name: pigallery2-release
          path: pigallery2-release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Verify Platform
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.container }}/Dockerfile.build
          platforms: ${{ matrix.platform }}
          push: false # Do not push yet
          cache-from: type=gha,scope=${{ matrix.container }}-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && format('type=gha,mode=max,scope={0}-{1}', matrix.container, matrix.arch) || '' }}

  build-verify-docker:
    name: build-verify-docker
    runs-on: ubuntu-latest
    needs: [build-verify-docker-image]
    if: ${{ !cancelled() }}
    steps:
      - name: Verify all Docker builds passed
        run: |
          if [ "${{ needs.build-verify-docker-image.result }}" != "success" ]; then
            echo "Docker verification matrix failed (result: ${{ needs.build-verify-docker-image.result }})."
            exit 1
          fi

  # --- DOCKER LOGIN AND PUSH ---
  push-docker:
    runs-on: ubuntu-latest
    needs: [test, build-verify-docker]
    # Only push on release tags, never on PRs or regular branch merges
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        container: [alpine, debian-trixie]
        include:
          - container: alpine
            platforms: linux/amd64,linux/arm64
          - container: debian-trixie
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download Release Artifact
        uses: actions/download-artifact@v8
        with:
          name: pigallery2-release
          path: pigallery2-release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Push Verified Images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.container }}/Dockerfile.build
          platforms: ${{ matrix.platforms }}
          push: true
          cache-from: |
            type=gha,scope=${{ matrix.container }}-amd64
            type=gha,scope=${{ matrix.container }}-arm64
          tags: |
            ${{ (github.ref == 'refs/heads/master' && matrix.container == 'debian-trixie') && format('{0}/pigallery2:edge,{0}/pigallery2:edge-{1}', secrets.REGISTRY_NAMESPACE, matrix.container) || '' }}
            ${{ (github.ref == 'refs/heads/master' && matrix.container != 'debian-trixie') && format('{0}/pigallery2:edge-{1}', secrets.REGISTRY_NAMESPACE, matrix.container) || '' }}
            ${{ (github.ref == 'refs/heads/experimental') && format('{0}/pigallery2:experimental-{1}', secrets.REGISTRY_NAMESPACE, matrix.container) || '' }}
            ${{ (startsWith(github.ref, 'refs/tags/') && matrix.container == 'debian-trixie') && format('{0}/pigallery2:{1},{0}/pigallery2:latest,{0}/pigallery2:edge-{2}', secrets.REGISTRY_NAMESPACE, github.ref_name, matrix.container) || '' }}
            ${{ (startsWith(github.ref, 'refs/tags/') && matrix.container != 'debian-trixie') && format('{0}/pigallery2:{1}-{2},{0}/pigallery2:latest-{2},{0}/pigallery2:edge-{2}', secrets.REGISTRY_NAMESPACE, github.ref_name, matrix.container) || '' }}
