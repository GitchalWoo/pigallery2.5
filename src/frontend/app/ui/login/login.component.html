@if (prismDesign) {
<div class="login-shell">
  <section class="login-art" aria-labelledby="login-headline">
    <div class="login-brand"><app-icon [width]="36" [height]="36"></app-icon><strong>{{title}}</strong></div>
    <div class="orbit-art" aria-hidden="true"><div class="orbit-core"></div><div class="orbit-ring"></div><div class="orbit-satellite"></div></div>
    <div class="login-manifesto">
      <span class="collection-eyebrow" i18n>A place for every moment</span>
      <h1 id="login-headline" i18n>Life moves.<br>Keep the light.</h1>
      <p i18n>Your world, collected. A little closer.</p>
    </div>
  </section>
  <div class="login-panel">
  <div class="row align-self-end">
    <app-language></app-language>
  </div>
  <div class="row card align-self-center">
    <div class="card-body">
      <div class="login-mobile-brand"><app-icon [width]="32" [height]="32"></app-icon><strong>{{title}}</strong></div>
      <span class="collection-eyebrow" i18n>Your photo library</span>
      <h2 class="card-title" i18n>Please log in</h2>
      <ng-container [ngTemplateOutlet]="loginFields"></ng-container>

    </div>
  </div>
  </div>
</div>
} @else {
<div class="container d-flex  flex-column justify-content-center">
  <div class="row align-self-end">
    <app-language></app-language>
  </div>
  <div class="row title  align-self-center">
    <h1>
      <app-icon [width]="80"></app-icon>
    {{title}}</h1>
  </div>
  <div class="row card align-self-center">
    <div class="card-body">
      <h4 class="card-title" i18n>Please log in</h4>
      <ng-container [ngTemplateOutlet]="loginFields"></ng-container>

    </div>
  </div>
</div>
}

<ng-template #loginFields>
      <form name="form" id="form" #LoginForm="ngForm" (submit)="onLogin()">
        <div class="error-message" [hidden]="loginError==false" i18n>
          Wrong username or password
        </div>

        <!-- OIDC login option -->
        @if (oidcEnabled) {
          <div class="d-grid gap-2 mb-3">
            <button type="button" class="btn btn-primary btn-lg" (click)="onLoginWithOIDC()">
              <ng-icon name="ionLogInOutline" class="me-1"></ng-icon>
              <span i18n>Login with</span> {{oidcDisplayName}}
            </button>
            <div class="text-center text-muted" i18n>or</div>
          </div>
        }

        <div class="input-group mb-3">
          <div class="input-group-text"><ng-icon name="ionPersonOutline"></ng-icon></div>
          <input type="text"
            i18n-placeholder
            class="form-control"
            name="username"
            id="username"
            autocomplete="login-username"
            [(ngModel)]="loginCredential.username"
            placeholder="Username"
            required>
        </div>

        <div class="input-group mb-3">
          <div class="input-group-text"><ng-icon name="ionLockClosedOutline"></ng-icon></div>
          <input type="password"
            i18n-placeholder
            class="form-control"
            name="password"
            id="password"
            placeholder="Password"
            autocomplete="login-password"
            autocorrect="off"
            autocapitalize="none"
            [(ngModel)]="loginCredential.password"
            required>
        </div>

        <div class="form-check">
          <input type="checkbox" class="form-check-input" name="rememberMe" id="rememberMe"
            [(ngModel)]="loginCredential.rememberMe">
          <label class="form-check-label" for="rememberMe" i18n>Remember me</label>
        </div>

        <!-- Button -->
        <div class="col-sm-12 controls d-grid gap-2">
          <button class="btn  btn-lg"
            [class.btn-outline-secondary]="oidcEnabled"
            [class.btn-primary]="!oidcEnabled"
            [disabled]="!LoginForm.form.valid || inProgress"
            type="submit"
            name="action" i18n>Login
          </button>
        </div>
      </form>
</ng-template>
