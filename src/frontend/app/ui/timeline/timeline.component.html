<app-gallery-lightbox [grid]="lightboxGrid"></app-gallery-lightbox>
<app-frame>
  <div body class="container-fluid app-gallery-body timeline-body" [class.timeline-has-rail]="hasSummary">
    <app-gallery-grid [mediaGroups]="mediaGroups"
      [mediaIdFn]="mediaIdFn"
      [extraQueryParams]="photoQueryParams"
      [groupHeaderMethod]="headerMethod"
      [placeholderAspect]="store.placeholderAspect"
      [keepContentAnchor]="true"
      [showInlineBlog]="false"
      [showScrollLabel]="false"></app-gallery-grid>

    @if (ready && !store.days && !store.error) {
      <div class="d-flex justify-content-center my-4" role="status">
        <div class="spinner-border text-secondary" aria-hidden="true"></div>
        <span class="visually-hidden" i18n>Loading the timeline…</span>
      </div>
    }

    @if (store.error) {
      <div class="alert alert-danger d-flex align-items-center my-3 timeline-error" role="alert">
        <span class="flex-grow-1">
          <ng-container i18n>Could not load the timeline.</ng-container>
          {{ store.error }}
        </span>
        <button type="button" class="btn btn-sm btn-outline-danger" (click)="retry()" i18n>Retry</button>
      </div>
    }

    @if (ready && store.days?.length === 0 && !store.error) {
      <div class="no-item-msg text-center my-5">
        <h2 i18n>No media to show.</h2>
      </div>
    }

    <app-timeline-scrubber
      [summary]="store.summary"
      [currentMonthKey]="currentMonthKey"
      (jumpToMonth)="jumpToMonth($event)"
      (dragChange)="onScrubberDrag($event)" />
  </div>
</app-frame>

<app-media-button-modal></app-media-button-modal>
